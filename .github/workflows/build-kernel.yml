name: Build Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b android12-5.10 https://android.googlesource.com/kernel/common kernel_src

      - name: Integrate SukiSU-Ultra
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel_src
        run: |
          cd $KERNEL_DIR
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          cd ${{ github.workspace }}/kernel_src
          # Thêm lệnh make / build kernel của mày ở đây
          # Ví dụ: make ARCH=arm64 LLVM=1 defconfig && make ARCH=arm64 LLVM=1 -j$(nproc)
