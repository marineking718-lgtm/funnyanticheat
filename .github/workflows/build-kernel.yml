- name: Clone Android 12 Common Kernel (5.10)
        run: |
          rm -rf kernel_src
          git clone --depth=1 -b android12-5.10 https://android.googlesource.com/kernel/common kernel_src

      - name: Integrate SukiSU-Ultra
        run: |
          cd ${{ github.workspace }}/kernel_src
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Build x86_64 Kernel
        run: |
          cd ${{ github.workspace }}/kernel_src
          make ARCH=x86_64 MRPROPER
          make ARCH=x86_64 x86_64_defconfig
          
          # Enable Kprobes cho SukiSU
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          
          make ARCH=x86_64 olddefconfig
          make ARCH=x86_64 -j$(nproc)
